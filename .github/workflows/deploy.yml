name: Deploy to Hetzner

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the Docker image
        run: docker build . --file Dockerfile --tag mtg-alt-art-maker:$(date +%s)

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to Hetzner via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_IP }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script_stop: true
          script: |
            if [ ! -d /opt/projects/artmaker/.git ]; then
              mkdir -p /opt/projects
              git clone git@github.com:grsbe/mtg_alt_art_maker.git /opt/projects/artmaker
            fi
            cd /opt/projects/artmaker
            git pull origin main
            docker compose up -d --build
            docker image prune -f
